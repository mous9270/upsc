<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        var stored = localStorage.getItem('theme');
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
        // Detect Capacitor native context early so CSS can apply reliable safe-area fallbacks.
        // env(safe-area-inset-top) often returns 0 in Android WebView until layout is done,
        // so we use max() with a fixed 32px minimum in .cap-native styles below.
        if (window.Capacitor) document.documentElement.classList.add('cap-native');
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
